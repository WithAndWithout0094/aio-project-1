<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 840" role="img" aria-label="W3 사이드바 와이어프레임 — Claude">
  <style>
    text { font-family: 'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',-apple-system,'Segoe UI',sans-serif; }
    .title { font-size: 18px; font-weight: 700; fill: #111827; }
    .sub   { font-size: 12.5px; fill: #6b7280; }
    .h     { font-size: 13px; font-weight: 700; fill: #111827; }
    .d     { font-size: 11.5px; fill: #6b7280; }
    .num   { font-size: 11px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    .bnum  { font-size: 10.5px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    .row   { font-size: 12.5px; fill: #111827; }
    .grp   { font-size: 10.5px; font-weight: 700; fill: #9ca3af; }
    .item  { font-size: 12.5px; fill: #374151; }
  </style>

  <!-- card background -->
  <rect x="1" y="1" width="778" height="838" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="32" y="42" class="title">W3 · 사이드바 — 서랍 메뉴</text>
  <text x="32" y="64" class="sub">채팅 화면에서 ≡ 버튼 또는 스와이프로 여는 서랍</text>

  <!-- phone frame -->
  <rect x="36" y="92" width="336" height="708" rx="26" fill="#ffffff" stroke="#374151" stroke-width="2"/>

  <!-- dimmed chat screen behind (right) -->
  <path d="M 300,94 L 346,94 Q 370,94 370,118 L 370,774 Q 370,798 346,798 L 300,798 Z" fill="#111827" opacity="0.22"/>

  <!-- drawer panel (left) -->
  <path d="M 62,94 L 300,94 L 300,798 L 62,798 Q 38,798 38,774 L 38,118 Q 38,94 62,94 Z" fill="#ffffff" stroke="#e5e7eb"/>

  <!-- search -->
  <rect x="54" y="116" width="232" height="36" rx="18" fill="#f3f4f6"/>
  <text x="70" y="139" font-size="12" fill="#6b7280">🔍  검색</text>

  <!-- quick actions -->
  <text x="70" y="186" class="row">✏️  새 채팅</text>
  <text x="70" y="220" class="row">💬  채팅</text>
  <text x="70" y="254" class="row">📁  프로젝트</text>
  <line x1="54" y1="278" x2="286" y2="278" stroke="#e5e7eb"/>

  <!-- recents -->
  <text x="70" y="304" class="grp">최근 항목</text>
  <rect x="54" y="314" width="232" height="28" rx="8" fill="#eef2ff"/>
  <text x="70" y="333" font-size="12.5" fill="#1e3a8a">면접 준비 도와줘</text>
  <text x="70" y="364" class="item">회의록 3줄 요약</text>
  <text x="70" y="392" class="item">서울 날씨와 우산</text>
  <text x="70" y="420" class="item">여행 일정 짜기</text>
  <text x="70" y="448" class="item">파이썬 공부 계획</text>
  <text x="70" y="476" class="item">이력서 문장 다듬기</text>

  <!-- profile -->
  <line x1="54" y1="742" x2="286" y2="742" stroke="#e5e7eb"/>
  <circle cx="72" cy="768" r="13" fill="#e5e7eb" stroke="#d1d5db"/>
  <circle cx="72" cy="764" r="4.5" fill="#ffffff"/>
  <path d="M 63,775 Q 72,766 81,775" fill="#ffffff"/>
  <text x="94" y="773" class="row">사용자</text>
  <rect x="140" y="756" width="34" height="18" rx="9" fill="#eef2ff"/>
  <text x="157" y="769" font-size="10" fill="#1e3a8a" text-anchor="middle">Pro</text>
  <text x="262" y="771" font-size="14" fill="#9ca3af">···</text>

  <!-- in-phone badges (left rail) -->
  <g>
    <circle cx="46" cy="134" r="9" fill="#2563eb"/><text x="46" y="138" class="bnum">1</text>
    <circle cx="46" cy="182" r="9" fill="#2563eb"/><text x="46" y="186" class="bnum">2</text>
    <circle cx="46" cy="237" r="9" fill="#2563eb"/><text x="46" y="241" class="bnum">3</text>
    <circle cx="46" cy="318" r="9" fill="#2563eb"/><text x="46" y="322" class="bnum">4</text>
    <circle cx="46" cy="768" r="9" fill="#2563eb"/><text x="46" y="772" class="bnum">5</text>
  </g>

  <!-- note under phone -->
  <text x="36" y="824" font-size="11" fill="#6b7280">오른쪽 어두운 부분: 뒤에 채팅 화면(S1)이 그대로 있음 — 탭하면 서랍이 닫힘</text>

  <!-- legend -->
  <g>
    <circle cx="430" cy="140" r="10" fill="#2563eb"/><text x="430" y="144" class="num">1</text>
    <text x="450" y="144" class="h">검색</text>
    <text x="450" y="164" class="d">쌓여 있는 대화 속에서 옛 대화를 바로 찾기</text>

    <circle cx="430" cy="250" r="10" fill="#2563eb"/><text x="430" y="254" class="num">2</text>
    <text x="450" y="254" class="h">새 채팅</text>
    <text x="450" y="274" class="d">서랍에서도 새 주제를 바로 시작</text>

    <circle cx="430" cy="360" r="10" fill="#2563eb"/><text x="430" y="364" class="num">3</text>
    <text x="450" y="364" class="h">채팅 · 프로젝트</text>
    <text x="450" y="384" class="d">프로젝트 = 자료·지침을 묶어 두는 작업 공간</text>
    <text x="450" y="400" class="d">Claude는 프로젝트가 1급 메뉴</text>

    <circle cx="430" cy="470" r="10" fill="#2563eb"/><text x="430" y="474" class="num">4</text>
    <text x="450" y="474" class="h">최근 항목</text>
    <text x="450" y="494" class="d">최근 대화가 최신순으로 자동 정리</text>
    <text x="450" y="510" class="d">파란 줄 = 지금 열려 있는 대화</text>

    <circle cx="430" cy="580" r="10" fill="#2563eb"/><text x="430" y="584" class="num">5</text>
    <text x="450" y="584" class="h">프로필</text>
    <text x="450" y="604" class="d">설정(S4) 입구 · 구독 등급(Pro) 표시</text>
  </g>
</svg>
