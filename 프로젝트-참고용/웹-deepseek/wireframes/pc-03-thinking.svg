<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 640" role="img" aria-label="D3 사고 과정 화면 와이어프레임 — 데스크톱 DeepSeek">
  <style>
    text { font-family: 'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',-apple-system,'Segoe UI',sans-serif; }
    .title { font-size: 18px; font-weight: 700; fill: #111827; }
    .sub   { font-size: 12.5px; fill: #6b7280; }
    .h     { font-size: 12.5px; font-weight: 700; fill: #111827; }
    .d     { font-size: 11px; fill: #6b7280; }
    .num   { font-size: 11px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    .bnum  { font-size: 10px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    .item  { font-size: 10.5px; fill: #374151; }
    .grp   { font-size: 9px; font-weight: 700; fill: #9ca3af; }
  </style>

  <rect x="1" y="1" width="778" height="638" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="32" y="42" class="title">D3 · 사고 과정 화면 — 데스크톱</text>
  <text x="32" y="64" class="sub">답이 어떻게 나왔는지 과정을 펼쳐 보여주는, DeepSeek만의 화면</text>

  <!-- browser window -->
  <rect x="32" y="80" width="716" height="400" rx="10" fill="#ffffff" stroke="#374151" stroke-width="1.8"/>
  <circle cx="52" cy="95" r="5" fill="#e5e7eb" stroke="#d1d5db"/>
  <circle cx="68" cy="95" r="5" fill="#e5e7eb" stroke="#d1d5db"/>
  <circle cx="84" cy="95" r="5" fill="#e5e7eb" stroke="#d1d5db"/>
  <rect x="290" y="87" width="200" height="17" rx="8.5" fill="#f3f4f6"/>
  <text x="390" y="99" font-size="10" fill="#6b7280" text-anchor="middle">chat.deepseek.com</text>
  <line x1="33" y1="110" x2="747" y2="110" stroke="#e5e7eb"/>

  <!-- sidebar -->
  <path d="M 33,111 L 203,111 L 203,479 L 43,479 Q 33,479 33,469 Z" fill="#fafbfc"/>
  <line x1="203" y1="111" x2="203" y2="479" stroke="#e5e7eb"/>
  <text x="48" y="138" font-size="11.5" font-weight="700" fill="#111827">🐳 DeepSeek</text>
  <rect x="41" y="152" width="154" height="30" rx="15" fill="#eef2ff"/>
  <text x="118" y="171" font-size="11" fill="#1e3a8a" text-anchor="middle">＋ 새 채팅</text>
  <text x="48" y="210" class="grp">오늘</text>
  <rect x="41" y="218" width="154" height="20" rx="6" fill="#eef2ff"/>
  <text x="48" y="232" font-size="10.5" fill="#1e3a8a">면접 준비 도와줘</text>
  <text x="48" y="254" class="item">회의록 3줄 요약</text>
  <line x1="41" y1="442" x2="195" y2="442" stroke="#e5e7eb"/>
  <circle cx="52" cy="460" r="9" fill="#e5e7eb" stroke="#d1d5db"/>
  <text x="66" y="464" font-size="11" fill="#111827">사용자</text>

  <!-- expanded thinking box -->
  <circle cx="308" cy="158" r="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="308" y="162" font-size="8.5" text-anchor="middle">🐳</text>
  <rect x="322" y="140" width="328" height="150" rx="12" fill="#f8f9fb" stroke="#e5e7eb"/>
  <text x="338" y="163" font-size="10" font-weight="700" fill="#6b7280">🧠 사고 과정 — 32초</text>
  <text x="620" y="163" font-size="11" fill="#9ca3af">⌃ 접기</text>
  <rect x="338" y="180" width="290" height="6" rx="3" fill="#e8ebef"/>
  <rect x="338" y="194" width="270" height="6" rx="3" fill="#e8ebef"/>
  <rect x="338" y="208" width="284" height="6" rx="3" fill="#e8ebef"/>
  <rect x="338" y="222" width="240" height="6" rx="3" fill="#e8ebef"/>
  <rect x="338" y="236" width="288" height="6" rx="3" fill="#e8ebef"/>
  <rect x="338" y="250" width="256" height="6" rx="3" fill="#e8ebef"/>
  <rect x="338" y="264" width="180" height="6" rx="3" fill="#e8ebef"/>

  <!-- final answer below -->
  <line x1="300" y1="306" x2="650" y2="306" stroke="#f0f2f5"/>
  <text x="300" y="332" font-size="11" font-weight="600" fill="#111827">최종 답변</text>
  <rect x="300" y="346" width="350" height="7" rx="3.5" fill="#e5e7eb"/>
  <rect x="300" y="360" width="320" height="7" rx="3.5" fill="#e5e7eb"/>
  <rect x="300" y="374" width="344" height="7" rx="3.5" fill="#e5e7eb"/>
  <rect x="300" y="388" width="200" height="7" rx="3.5" fill="#e5e7eb"/>

  <!-- composer hint -->
  <rect x="300" y="428" width="350" height="36" rx="12" fill="#f3f4f6" stroke="#e5e7eb"/>
  <text x="316" y="450" font-size="10" fill="#9ca3af">이어서 물어보세요</text>

  <!-- badges -->
  <g>
    <circle cx="322" cy="136" r="8.5" fill="#2563eb"/><text x="322" y="140" class="bnum">1</text>
    <circle cx="654" cy="158" r="8.5" fill="#2563eb"/><text x="654" y="162" class="bnum">2</text>
    <circle cx="296" cy="328" r="8.5" fill="#2563eb"/><text x="296" y="332" class="bnum">3</text>
  </g>

  <!-- legend (2 columns) -->
  <g>
    <circle cx="48" cy="512" r="10" fill="#2563eb"/><text x="48" y="516" class="num">1</text>
    <text x="66" y="516" class="h">사고 과정 상자 — 펼친 상태</text>
    <text x="66" y="534" class="d">모델이 답을 만들며 한 생각이 회색 글로 흘러나옴</text>

    <circle cx="48" cy="578" r="10" fill="#2563eb"/><text x="48" y="582" class="num">2</text>
    <text x="66" y="582" class="h">접기 (⌃)</text>
    <text x="66" y="600" class="d">과정이 필요 없으면 한 줄로 접어 둠</text>

    <circle cx="400" cy="512" r="10" fill="#2563eb"/><text x="400" y="516" class="num">3</text>
    <text x="418" y="516" class="h">최종 답변 — 과정과 구분되어 아래에</text>
    <text x="418" y="534" class="d">과정은 회색·가늘게, 답변은 진하게 — 급이 다르게 보임</text>
  </g>

  <!-- note -->
  <rect x="418" y="560" width="330" height="52" rx="10" fill="#f8fafc" stroke="#e5e7eb"/>
  <text x="434" y="582" class="d" fill="#475569">Claude 아티팩트 · ChatGPT 캔버스 자리에, DeepSeek은</text>
  <text x="434" y="600" class="d" fill="#475569">패널 대신 '사고 과정'을 내세운다 — 셋의 개성이 갈리는 지점.</text>
</svg>
