<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 840" role="img" aria-label="W3 사이드바 와이어프레임 — DeepSeek">
  <style>
    text { font-family: 'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',-apple-system,'Segoe UI',sans-serif; }
    .title { font-size: 18px; font-weight: 700; fill: #111827; }
    .sub   { font-size: 12.5px; fill: #6b7280; }
    .h     { font-size: 13px; font-weight: 700; fill: #111827; }
    .d     { font-size: 11.5px; fill: #6b7280; }
    .num   { font-size: 11px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    .bnum  { font-size: 10.5px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    .row   { font-size: 12.5px; fill: #111827; }
    .grp   { font-size: 10.5px; font-weight: 700; fill: #9ca3af; }
    .item  { font-size: 12.5px; fill: #374151; }
  </style>

  <rect x="1" y="1" width="778" height="838" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="32" y="42" class="title">W3 · 사이드바 — 서랍 메뉴</text>
  <text x="32" y="64" class="sub">부가 메뉴가 거의 없는, 셋 중 가장 단순한 서랍</text>

  <!-- phone frame -->
  <rect x="36" y="92" width="336" height="708" rx="26" fill="#ffffff" stroke="#374151" stroke-width="2"/>

  <!-- dimmed chat screen behind (right) -->
  <path d="M 300,94 L 346,94 Q 370,94 370,118 L 370,774 Q 370,798 346,798 L 300,798 Z" fill="#111827" opacity="0.22"/>

  <!-- drawer panel (left) -->
  <path d="M 62,94 L 300,94 L 300,798 L 62,798 Q 38,798 38,774 L 38,118 Q 38,94 62,94 Z" fill="#ffffff" stroke="#e5e7eb"/>

  <!-- new chat button -->
  <rect x="54" y="116" width="232" height="38" rx="19" fill="#eef2ff"/>
  <text x="170" y="140" font-size="12.5" fill="#1e3a8a" text-anchor="middle">＋ 새 채팅</text>

  <!-- history -->
  <text x="70" y="186" class="grp">오늘</text>
  <rect x="54" y="196" width="232" height="28" rx="8" fill="#eef2ff"/>
  <text x="70" y="215" font-size="12.5" fill="#1e3a8a">면접 준비 도와줘</text>
  <text x="70" y="246" class="item">회의록 3줄 요약</text>
  <text x="70" y="276" class="grp">어제</text>
  <text x="70" y="302" class="item">여행 일정 짜기</text>
  <text x="70" y="332" class="grp">지난 7일</text>
  <text x="70" y="358" class="item">파이썬 공부 계획</text>
  <text x="70" y="384" class="item">이력서 문장 다듬기</text>

  <!-- profile -->
  <line x1="54" y1="742" x2="286" y2="742" stroke="#e5e7eb"/>
  <circle cx="72" cy="768" r="13" fill="#e5e7eb" stroke="#d1d5db"/>
  <circle cx="72" cy="764" r="4.5" fill="#ffffff"/>
  <path d="M 63,775 Q 72,766 81,775" fill="#ffffff"/>
  <text x="94" y="773" class="row">사용자</text>
  <text x="262" y="771" font-size="14" fill="#9ca3af">···</text>

  <!-- in-phone badges (left rail) -->
  <g>
    <circle cx="46" cy="134" r="9" fill="#2563eb"/><text x="46" y="138" class="bnum">1</text>
    <circle cx="46" cy="200" r="9" fill="#2563eb"/><text x="46" y="204" class="bnum">2</text>
    <circle cx="46" cy="768" r="9" fill="#2563eb"/><text x="46" y="772" class="bnum">3</text>
  </g>

  <!-- note under phone -->
  <text x="36" y="824" font-size="11" fill="#6b7280">오른쪽 어두운 부분: 뒤에 채팅 화면(S1)이 그대로 있음 — 탭하면 서랍이 닫힘</text>

  <!-- legend -->
  <g>
    <circle cx="430" cy="150" r="10" fill="#2563eb"/><text x="430" y="154" class="num">1</text>
    <text x="450" y="154" class="h">새 채팅 — 큰 버튼 하나</text>
    <text x="450" y="174" class="d">서랍에서 가장 눈에 띄는 자리</text>

    <circle cx="430" cy="260" r="10" fill="#2563eb"/><text x="430" y="264" class="num">2</text>
    <text x="450" y="264" class="h">대화 기록</text>
    <text x="450" y="284" class="d">최신순 · 날짜 그룹(오늘 / 어제 / 지난 7일)</text>
    <text x="450" y="300" class="d">파란 줄 = 지금 열려 있는 대화</text>

    <circle cx="430" cy="370" r="10" fill="#2563eb"/><text x="430" y="374" class="num">3</text>
    <text x="450" y="374" class="h">프로필</text>
    <text x="450" y="394" class="d">설정(S3)으로 들어가는 입구</text>
  </g>

  <!-- simplicity note -->
  <rect x="418" y="450" width="330" height="88" rx="10" fill="#f8fafc" stroke="#e5e7eb"/>
  <text x="434" y="478" class="d" fill="#475569">여기에 없는 것 — 검색 · 프로젝트 · GPTs 같은</text>
  <text x="434" y="498" class="d" fill="#475569">부가 메뉴가 없다. 새 채팅과 기록뿐인,</text>
  <text x="434" y="518" class="d" fill="#475569">화면 수를 극단적으로 줄인 IA.</text>
</svg>
