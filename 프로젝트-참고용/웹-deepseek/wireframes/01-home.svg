<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 840" role="img" aria-label="W1 채팅 화면(빈 상태) 와이어프레임 — DeepSeek">
  <style>
    text { font-family: 'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',-apple-system,'Segoe UI',sans-serif; }
    .title { font-size: 18px; font-weight: 700; fill: #111827; }
    .sub   { font-size: 12.5px; fill: #6b7280; }
    .h     { font-size: 13px; font-weight: 700; fill: #111827; }
    .d     { font-size: 11.5px; fill: #6b7280; }
    .num   { font-size: 11px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    .bnum  { font-size: 10.5px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    .pg    { font-size: 12px; fill: #9ca3af; }
  </style>

  <rect x="1" y="1" width="778" height="838" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="32" y="42" class="title">W1 · 채팅 화면 — 빈 상태</text>
  <text x="32" y="64" class="sub">DeepSeek 모바일 앱 · 켜면 보이는 첫 화면 · 파란 번호는 오른쪽 설명과 짝</text>

  <!-- phone frame -->
  <rect x="36" y="92" width="336" height="708" rx="26" fill="#ffffff" stroke="#374151" stroke-width="2"/>

  <!-- status bar -->
  <text x="64" y="122" class="pg" font-size="10.5">9:41</text>
  <rect x="326" y="112" width="22" height="11" rx="3" fill="none" stroke="#9ca3af"/>
  <rect x="328" y="114" width="13" height="7" rx="1.5" fill="#9ca3af"/>
  <rect x="349" y="115" width="3" height="5" rx="1" fill="#9ca3af"/>

  <!-- top bar -->
  <g stroke="#374151" stroke-width="2.2" stroke-linecap="round">
    <line x1="62" y1="143" x2="84" y2="143"/>
    <line x1="62" y1="150" x2="84" y2="150"/>
    <line x1="62" y1="157" x2="84" y2="157"/>
  </g>
  <text x="204" y="155" font-size="14" font-weight="600" fill="#111827" text-anchor="middle">DeepSeek</text>
  <rect x="330" y="137" width="26" height="26" rx="7" fill="none" stroke="#374151" stroke-width="1.8"/>
  <line x1="336" y1="151" x2="347" y2="140" stroke="#374151" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="336" y1="151" x2="339" y2="151" stroke="#374151" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="38" y1="176" x2="370" y2="176" stroke="#e5e7eb"/>

  <!-- empty-state greeting -->
  <circle cx="204" cy="288" r="24" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="204" y="295" font-size="20" text-anchor="middle">🐳</text>
  <text x="204" y="338" font-size="13" fill="#6b7280" text-anchor="middle">안녕하세요!</text>
  <text x="204" y="362" font-size="15" font-weight="600" fill="#111827" text-anchor="middle">무엇을 도와드릴까요?</text>

  <!-- future conversation area hint -->
  <rect x="64" y="430" width="280" height="110" rx="12" fill="none" stroke="#d1d5db" stroke-dasharray="5 4"/>
  <text x="204" y="478" font-size="11" fill="#b3b9c2" text-anchor="middle">대화가 시작되면</text>
  <text x="204" y="496" font-size="11" fill="#b3b9c2" text-anchor="middle">말풍선이 여기에 쌓입니다</text>

  <!-- input card (2 rows) -->
  <rect x="52" y="670" width="304" height="108" rx="18" fill="#f3f4f6" stroke="#e5e7eb"/>
  <text x="70" y="702" class="pg">무엇이든 물어보세요</text>
  <rect x="68" y="732" width="118" height="28" rx="14" fill="#ffffff" stroke="#d1d5db"/>
  <text x="127" y="750" font-size="10" fill="#374151" text-anchor="middle">🧠 DeepThink · R1</text>
  <rect x="194" y="732" width="68" height="28" rx="14" fill="#ffffff" stroke="#d1d5db"/>
  <text x="228" y="750" font-size="10" fill="#374151" text-anchor="middle">🌐 검색</text>
  <circle cx="292" cy="746" r="13" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
  <line x1="286" y1="746" x2="298" y2="746" stroke="#6b7280" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="292" y1="740" x2="292" y2="752" stroke="#6b7280" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="330" cy="746" r="13" fill="#111827"/>
  <line x1="330" y1="751" x2="330" y2="742" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M 326,745 L 330,741 L 334,745" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- home indicator -->
  <rect x="164" y="788" width="80" height="4" rx="2" fill="#d1d5db"/>

  <!-- in-phone badges -->
  <g>
    <circle cx="98" cy="150" r="9" fill="#2563eb"/><text x="98" y="154" class="bnum">1</text>
    <circle cx="324" cy="132" r="9" fill="#2563eb"/><text x="324" y="136" class="bnum">2</text>
    <circle cx="204" cy="386" r="9" fill="#2563eb"/><text x="204" y="390" class="bnum">3</text>
    <circle cx="190" cy="728" r="9" fill="#2563eb"/><text x="190" y="732" class="bnum">4</text>
    <circle cx="292" cy="724" r="9" fill="#2563eb"/><text x="292" y="728" class="bnum">5</text>
    <circle cx="204" cy="666" r="9" fill="#2563eb"/><text x="204" y="670" class="bnum">6</text>
  </g>

  <!-- legend -->
  <g>
    <circle cx="430" cy="138" r="10" fill="#2563eb"/><text x="430" y="142" class="num">1</text>
    <text x="450" y="142" class="h">사이드바 열기 (≡)</text>
    <text x="450" y="162" class="d">대화 기록으로 가는 문</text>

    <circle cx="430" cy="238" r="10" fill="#2563eb"/><text x="430" y="242" class="num">2</text>
    <text x="450" y="242" class="h">새 채팅</text>
    <text x="450" y="262" class="d">언제든 새 주제로 시작</text>

    <circle cx="430" cy="338" r="10" fill="#2563eb"/><text x="430" y="342" class="num">3</text>
    <text x="450" y="342" class="h">인사말 — 빈 화면</text>
    <text x="450" y="362" class="d">버튼 없이 인사와 여백뿐 — 시선은 입력창으로</text>

    <circle cx="430" cy="438" r="10" fill="#2563eb"/><text x="430" y="442" class="num">4</text>
    <text x="450" y="442" class="h">모드 토글 — DeepThink(R1) · 웹 검색</text>
    <text x="450" y="462" class="d">깊게 생각할지, 검색해 올지 켜고 끄는 스위치</text>
    <text x="450" y="478" class="d">입력바 안에 있는 것이 DeepSeek의 특징</text>

    <circle cx="430" cy="558" r="10" fill="#2563eb"/><text x="430" y="562" class="num">5</text>
    <text x="450" y="562" class="h">첨부 (+)</text>
    <text x="450" y="582" class="d">사진 · 파일을 올려서 질문</text>

    <circle cx="430" cy="658" r="10" fill="#2563eb"/><text x="430" y="662" class="num">6</text>
    <text x="450" y="662" class="h">입력창</text>
    <text x="450" y="682" class="d">항상 하단 고정 — 엄지가 가장 편한 곳</text>
  </g>
</svg>
