<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 640" role="img" aria-label="D2 대화 중 화면 와이어프레임 — 데스크톱 DeepSeek">
  <style>
    text { font-family: 'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',-apple-system,'Segoe UI',sans-serif; }
    .title { font-size: 18px; font-weight: 700; fill: #111827; }
    .sub   { font-size: 12.5px; fill: #6b7280; }
    .h     { font-size: 12.5px; font-weight: 700; fill: #111827; }
    .d     { font-size: 11px; fill: #6b7280; }
    .num   { font-size: 11px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    .bnum  { font-size: 10px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    .item  { font-size: 10.5px; fill: #374151; }
    .grp   { font-size: 9px; font-weight: 700; fill: #9ca3af; }
    .pg    { font-size: 10.5px; fill: #9ca3af; }
  </style>

  <rect x="1" y="1" width="778" height="638" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="32" y="42" class="title">D2 · 대화 중 — 데스크톱</text>
  <text x="32" y="64" class="sub">답변 위에 '생각함' 상자가 접혀 있는 상태 · 글은 가운데 칼럼에만</text>

  <!-- browser window -->
  <rect x="32" y="80" width="716" height="400" rx="10" fill="#ffffff" stroke="#374151" stroke-width="1.8"/>
  <circle cx="52" cy="95" r="5" fill="#e5e7eb" stroke="#d1d5db"/>
  <circle cx="68" cy="95" r="5" fill="#e5e7eb" stroke="#d1d5db"/>
  <circle cx="84" cy="95" r="5" fill="#e5e7eb" stroke="#d1d5db"/>
  <rect x="290" y="87" width="200" height="17" rx="8.5" fill="#f3f4f6"/>
  <text x="390" y="99" font-size="10" fill="#6b7280" text-anchor="middle">chat.deepseek.com</text>
  <line x1="33" y1="110" x2="747" y2="110" stroke="#e5e7eb"/>

  <!-- sidebar -->
  <path d="M 33,111 L 203,111 L 203,479 L 43,479 Q 33,479 33,469 Z" fill="#fafbfc"/>
  <line x1="203" y1="111" x2="203" y2="479" stroke="#e5e7eb"/>
  <text x="48" y="138" font-size="11.5" font-weight="700" fill="#111827">🐳 DeepSeek</text>
  <rect x="41" y="152" width="154" height="30" rx="15" fill="#eef2ff"/>
  <text x="118" y="171" font-size="11" fill="#1e3a8a" text-anchor="middle">＋ 새 채팅</text>
  <text x="48" y="210" class="grp">오늘</text>
  <rect x="41" y="218" width="154" height="20" rx="6" fill="#eef2ff"/>
  <text x="48" y="232" font-size="10.5" fill="#1e3a8a">면접 준비 도와줘</text>
  <text x="48" y="254" class="item">회의록 3줄 요약</text>
  <text x="48" y="280" class="grp">어제</text>
  <text x="48" y="302" class="item">여행 일정 짜기</text>
  <line x1="41" y1="442" x2="195" y2="442" stroke="#e5e7eb"/>
  <circle cx="52" cy="460" r="9" fill="#e5e7eb" stroke="#d1d5db"/>
  <text x="66" y="464" font-size="11" fill="#111827">사용자</text>

  <!-- reading column -->
  <rect x="470" y="150" width="180" height="40" rx="12" fill="#e9ecef"/>
  <text x="484" y="167" font-size="10.5" fill="#111827">다음 주에 면접이 있어.</text>
  <text x="484" y="181" font-size="10.5" fill="#111827">뭐부터 준비할까?</text>

  <!-- collapsed thinking bar -->
  <circle cx="308" cy="222" r="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="308" y="226" font-size="8.5" text-anchor="middle">🐳</text>
  <rect x="322" y="210" width="170" height="24" rx="12" fill="#f3f4f6" stroke="#e5e7eb"/>
  <text x="333" y="226" font-size="9.5" fill="#6b7280">🧠 32초 동안 생각함  ⌄</text>

  <!-- answer -->
  <text x="300" y="262" font-size="11" fill="#111827">면접 준비, 이렇게 시작하세요.</text>
  <rect x="300" y="276" width="350" height="7" rx="3.5" fill="#e5e7eb"/>
  <rect x="300" y="290" width="330" height="7" rx="3.5" fill="#e5e7eb"/>
  <rect x="300" y="304" width="348" height="7" rx="3.5" fill="#e5e7eb"/>
  <rect x="300" y="318" width="210" height="7" rx="3.5" fill="#e5e7eb"/>
  <rect x="514" y="313" width="3" height="12" fill="#2563eb"/>
  <text x="300" y="348" font-size="10.5" fill="#6b7280">복사 · 재생성 · 👍 · 👎</text>

  <!-- docked composer with toggles -->
  <rect x="300" y="408" width="350" height="56" rx="14" fill="#f3f4f6" stroke="#e5e7eb"/>
  <text x="316" y="430" class="pg">이어서 물어보세요</text>
  <rect x="314" y="438" width="96" height="20" rx="10" fill="#ffffff" stroke="#d1d5db"/>
  <text x="362" y="452" font-size="9" fill="#374151" text-anchor="middle">🧠 DeepThink · R1</text>
  <rect x="416" y="438" width="54" height="20" rx="10" fill="#ffffff" stroke="#d1d5db"/>
  <text x="443" y="452" font-size="9" fill="#374151" text-anchor="middle">🌐 검색</text>
  <circle cx="630" cy="446" r="9" fill="#111827"/>
  <line x1="630" y1="450" x2="630" y2="443" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M 627,445.5 L 630,442.5 L 633,445.5" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- badges -->
  <g>
    <circle cx="462" cy="146" r="8.5" fill="#2563eb"/><text x="462" y="150" class="bnum">1</text>
    <circle cx="500" cy="222" r="8.5" fill="#2563eb"/><text x="500" y="226" class="bnum">2</text>
    <circle cx="662" cy="262" r="8.5" fill="#2563eb"/><text x="662" y="266" class="bnum">3</text>
    <circle cx="296" cy="404" r="8.5" fill="#2563eb"/><text x="296" y="408" class="bnum">4</text>
  </g>

  <!-- legend (2 columns) -->
  <g>
    <circle cx="48" cy="512" r="10" fill="#2563eb"/><text x="48" y="516" class="num">1</text>
    <text x="66" y="516" class="h">내 질문 — 오른쪽 · 회색 · 좁게</text>
    <text x="66" y="534" class="d">셋 다 똑같은 규칙</text>

    <circle cx="48" cy="578" r="10" fill="#2563eb"/><text x="48" y="582" class="num">2</text>
    <text x="66" y="582" class="h">'생각함' 상자 — 접힌 상태</text>
    <text x="66" y="600" class="d">답 위에 사고 과정 입구가 붙어 있음</text>

    <circle cx="400" cy="512" r="10" fill="#2563eb"/><text x="400" y="516" class="num">3</text>
    <text x="418" y="516" class="h">답변 — 왼쪽 · 칼럼 전체 폭</text>
    <text x="418" y="534" class="d">스트리밍 커서도 그대로</text>

    <circle cx="400" cy="578" r="10" fill="#2563eb"/><text x="400" y="582" class="num">4</text>
    <text x="418" y="582" class="h">입력창 — 하단 고정 · 토글 유지</text>
    <text x="418" y="600" class="d">DeepThink · 검색 스위치가 계속 붙어 다님</text>
  </g>
</svg>
