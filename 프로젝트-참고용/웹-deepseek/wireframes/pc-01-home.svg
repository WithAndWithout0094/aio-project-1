<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 640" role="img" aria-label="D1 시작 화면 와이어프레임 — 데스크톱 DeepSeek">
  <style>
    text { font-family: 'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',-apple-system,'Segoe UI',sans-serif; }
    .title { font-size: 18px; font-weight: 700; fill: #111827; }
    .sub   { font-size: 12.5px; fill: #6b7280; }
    .h     { font-size: 12.5px; font-weight: 700; fill: #111827; }
    .d     { font-size: 11px; fill: #6b7280; }
    .num   { font-size: 11px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    .bnum  { font-size: 10px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    .item  { font-size: 10.5px; fill: #374151; }
    .grp   { font-size: 9px; font-weight: 700; fill: #9ca3af; }
    .pg    { font-size: 11.5px; fill: #9ca3af; }
  </style>

  <rect x="1" y="1" width="778" height="638" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="32" y="42" class="title">D1 · 시작 화면 — 데스크톱</text>
  <text x="32" y="64" class="sub">chat.deepseek.com · 오른쪽 패널이 없는, 영역 둘짜리 화면</text>

  <!-- browser window -->
  <rect x="32" y="80" width="716" height="400" rx="10" fill="#ffffff" stroke="#374151" stroke-width="1.8"/>
  <circle cx="52" cy="95" r="5" fill="#e5e7eb" stroke="#d1d5db"/>
  <circle cx="68" cy="95" r="5" fill="#e5e7eb" stroke="#d1d5db"/>
  <circle cx="84" cy="95" r="5" fill="#e5e7eb" stroke="#d1d5db"/>
  <rect x="290" y="87" width="200" height="17" rx="8.5" fill="#f3f4f6"/>
  <text x="390" y="99" font-size="10" fill="#6b7280" text-anchor="middle">chat.deepseek.com</text>
  <line x1="33" y1="110" x2="747" y2="110" stroke="#e5e7eb"/>

  <!-- sidebar -->
  <path d="M 33,111 L 203,111 L 203,479 L 43,479 Q 33,479 33,469 Z" fill="#fafbfc"/>
  <line x1="203" y1="111" x2="203" y2="479" stroke="#e5e7eb"/>
  <text x="48" y="138" font-size="11.5" font-weight="700" fill="#111827">🐳 DeepSeek</text>
  <rect x="41" y="152" width="154" height="30" rx="15" fill="#eef2ff"/>
  <text x="118" y="171" font-size="11" fill="#1e3a8a" text-anchor="middle">＋ 새 채팅</text>
  <text x="48" y="210" class="grp">오늘</text>
  <text x="48" y="232" class="item">면접 준비 도와줘</text>
  <text x="48" y="254" class="item">회의록 3줄 요약</text>
  <text x="48" y="280" class="grp">어제</text>
  <text x="48" y="302" class="item">여행 일정 짜기</text>
  <text x="48" y="328" class="grp">지난 7일</text>
  <text x="48" y="350" class="item">파이썬 공부 계획</text>
  <line x1="41" y1="442" x2="195" y2="442" stroke="#e5e7eb"/>
  <circle cx="52" cy="460" r="9" fill="#e5e7eb" stroke="#d1d5db"/>
  <text x="66" y="464" font-size="11" fill="#111827">사용자</text>

  <!-- main: greeting + centered composer -->
  <circle cx="475" cy="200" r="18" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="475" y="206" font-size="15" text-anchor="middle">🐳</text>
  <text x="475" y="245" font-size="15" font-weight="600" fill="#111827" text-anchor="middle">무엇을 도와드릴까요?</text>

  <rect x="330" y="272" width="290" height="88" rx="14" fill="#f3f4f6" stroke="#e5e7eb"/>
  <text x="346" y="298" class="pg">무엇이든 물어보세요</text>
  <rect x="344" y="322" width="104" height="24" rx="12" fill="#ffffff" stroke="#d1d5db"/>
  <text x="396" y="338" font-size="9.5" fill="#374151" text-anchor="middle">🧠 DeepThink · R1</text>
  <rect x="454" y="322" width="60" height="24" rx="12" fill="#ffffff" stroke="#d1d5db"/>
  <text x="484" y="338" font-size="9.5" fill="#374151" text-anchor="middle">🌐 검색</text>
  <circle cx="566" cy="334" r="10" fill="#ffffff" stroke="#9ca3af"/>
  <line x1="561" y1="334" x2="571" y2="334" stroke="#6b7280" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="566" y1="329" x2="566" y2="339" stroke="#6b7280" stroke-width="1.4" stroke-linecap="round"/>
  <circle cx="598" cy="334" r="11" fill="#111827"/>
  <line x1="598" y1="339" x2="598" y2="330" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M 594,333 L 598,329 L 602,333" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- badges -->
  <g>
    <circle cx="205" cy="136" r="8.5" fill="#2563eb"/><text x="205" y="140" class="bnum">1</text>
    <circle cx="205" cy="167" r="8.5" fill="#2563eb"/><text x="205" y="171" class="bnum">2</text>
    <circle cx="330" cy="268" r="8.5" fill="#2563eb"/><text x="330" y="272" class="bnum">3</text>
    <circle cx="448" cy="316" r="8.5" fill="#2563eb"/><text x="448" y="320" class="bnum">4</text>
  </g>

  <!-- legend (2 columns) -->
  <g>
    <circle cx="48" cy="512" r="10" fill="#2563eb"/><text x="48" y="516" class="num">1</text>
    <text x="66" y="516" class="h">사이드바 — 항상 펼쳐져 있음</text>
    <text x="66" y="534" class="d">새 채팅과 대화 기록뿐 — 부가 메뉴가 없음</text>

    <circle cx="48" cy="578" r="10" fill="#2563eb"/><text x="48" y="582" class="num">2</text>
    <text x="66" y="582" class="h">새 채팅 — 큰 버튼</text>
    <text x="66" y="600" class="d">서랍 맨 위, 가장 눈에 띄는 자리</text>

    <circle cx="400" cy="512" r="10" fill="#2563eb"/><text x="400" y="516" class="num">3</text>
    <text x="418" y="516" class="h">입력창 — 시작할 땐 화면 한가운데</text>
    <text x="418" y="534" class="d">오른쪽 패널이 없어 본문이 항상 넓다</text>

    <circle cx="400" cy="578" r="10" fill="#2563eb"/><text x="400" y="582" class="num">4</text>
    <text x="418" y="582" class="h">모드 토글 — DeepThink(R1) · 웹 검색</text>
    <text x="418" y="600" class="d">모델 선택 대신, 생각 모드를 켜고 끄는 방식</text>
  </g>
</svg>
