<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 840" role="img" aria-label="W4 설정 화면 와이어프레임 — DeepSeek">
  <style>
    text { font-family: 'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',-apple-system,'Segoe UI',sans-serif; }
    .title { font-size: 18px; font-weight: 700; fill: #111827; }
    .sub   { font-size: 12.5px; fill: #6b7280; }
    .h     { font-size: 13px; font-weight: 700; fill: #111827; }
    .d     { font-size: 11.5px; fill: #6b7280; }
    .num   { font-size: 11px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    .bnum  { font-size: 10.5px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    .lab   { font-size: 12.5px; fill: #111827; }
    .val   { font-size: 11.5px; fill: #9ca3af; text-anchor: end; }
    .chev  { font-size: 13px; fill: #c0c4cc; }
    .grp   { font-size: 10.5px; font-weight: 700; fill: #9ca3af; }
  </style>

  <rect x="1" y="1" width="778" height="838" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="32" y="42" class="title">W4 · 설정 화면</text>
  <text x="32" y="64" class="sub">사이드바 하단의 프로필에서 진입 · 항목이 가장 적은 설정</text>

  <!-- phone frame -->
  <rect x="36" y="92" width="336" height="708" rx="26" fill="#ffffff" stroke="#374151" stroke-width="2"/>

  <!-- status bar -->
  <text x="64" y="122" font-size="10.5" fill="#9ca3af">9:41</text>
  <rect x="326" y="112" width="22" height="11" rx="3" fill="none" stroke="#9ca3af"/>
  <rect x="328" y="114" width="13" height="7" rx="1.5" fill="#9ca3af"/>
  <rect x="349" y="115" width="3" height="5" rx="1" fill="#9ca3af"/>

  <!-- header -->
  <g stroke="#374151" stroke-width="2" stroke-linecap="round" fill="none">
    <line x1="74" y1="148" x2="64" y2="157"/>
    <line x1="64" y1="157" x2="74" y2="166"/>
  </g>
  <text x="204" y="162" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">설정</text>
  <line x1="38" y1="182" x2="370" y2="182" stroke="#e5e7eb"/>

  <!-- section: account -->
  <text x="56" y="212" class="grp">계정</text>
  <rect x="52" y="222" width="304" height="80" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="66" y="248" class="lab">이메일</text>
  <text x="344" y="248" class="val">user@example.com</text>
  <line x1="52" y1="262" x2="356" y2="262" stroke="#f1f3f5"/>
  <text x="66" y="288" class="lab">계정 관리</text>
  <text x="344" y="289" class="chev">›</text>

  <!-- section: app -->
  <text x="56" y="336" class="grp">앱</text>
  <rect x="52" y="346" width="304" height="120" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="66" y="372" class="lab">언어</text>
  <text x="334" y="372" class="val">한국어</text>
  <text x="344" y="373" class="chev">›</text>
  <line x1="52" y1="386" x2="356" y2="386" stroke="#f1f3f5"/>
  <text x="66" y="412" class="lab">테마</text>
  <text x="334" y="412" class="val">시스템</text>
  <text x="344" y="413" class="chev">›</text>
  <line x1="52" y1="426" x2="356" y2="426" stroke="#f1f3f5"/>
  <text x="66" y="452" class="lab">알림</text>
  <text x="334" y="452" class="val">켜짐</text>
  <text x="344" y="453" class="chev">›</text>

  <!-- section: data -->
  <text x="56" y="500" class="grp">데이터</text>
  <rect x="52" y="510" width="304" height="80" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="66" y="536" class="lab">대화 기록 관리</text>
  <text x="344" y="537" class="chev">›</text>
  <line x1="52" y1="550" x2="356" y2="550" stroke="#f1f3f5"/>
  <text x="66" y="576" class="lab">모든 대화 지우기</text>
  <text x="344" y="577" class="chev">›</text>

  <!-- section: info -->
  <text x="56" y="624" class="grp">정보</text>
  <rect x="52" y="634" width="304" height="80" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="66" y="660" class="lab">도움말</text>
  <text x="344" y="661" class="chev">›</text>
  <line x1="52" y1="674" x2="356" y2="674" stroke="#f1f3f5"/>
  <text x="66" y="700" class="lab">버전</text>
  <text x="344" y="700" class="val">1.2026.220</text>

  <!-- in-phone badges (left rail) -->
  <g>
    <circle cx="46" cy="240" r="9" fill="#2563eb"/><text x="46" y="244" class="bnum">1</text>
    <circle cx="46" cy="404" r="9" fill="#2563eb"/><text x="46" y="408" class="bnum">2</text>
    <circle cx="46" cy="548" r="9" fill="#2563eb"/><text x="46" y="552" class="bnum">3</text>
  </g>

  <!-- legend -->
  <g>
    <circle cx="430" cy="180" r="10" fill="#2563eb"/><text x="430" y="184" class="num">1</text>
    <text x="450" y="184" class="h">계정</text>
    <text x="450" y="204" class="d">로그인 정보와 계정 관리</text>

    <circle cx="430" cy="310" r="10" fill="#2563eb"/><text x="430" y="314" class="num">2</text>
    <text x="450" y="314" class="h">앱 환경</text>
    <text x="450" y="334" class="d">언어 · 테마 · 알림</text>

    <circle cx="430" cy="440" r="10" fill="#2563eb"/><text x="430" y="444" class="num">3</text>
    <text x="450" y="444" class="h">데이터</text>
    <text x="450" y="464" class="d">대화 기록 관리 · 삭제</text>
  </g>

  <!-- pattern note -->
  <rect x="418" y="520" width="330" height="88" rx="10" fill="#f8fafc" stroke="#e5e7eb"/>
  <text x="434" y="548" class="d" fill="#475569">패턴 노트 — '목록 + ›' 패턴은 셋 다 동일.</text>
  <text x="434" y="568" class="d" fill="#475569">다만 개인 맞춤(응답 스타일 · 메모리) 항목이 없어</text>
  <text x="434" y="588" class="d" fill="#475569">Claude · ChatGPT보다 설정이 한 층 단순하다.</text>
</svg>
