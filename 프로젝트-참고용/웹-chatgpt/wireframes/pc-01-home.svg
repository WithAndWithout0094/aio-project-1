<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 700" role="img" aria-label="D1 시작 화면 와이어프레임 — 데스크톱 ChatGPT">
  <style>
    text { font-family: 'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',-apple-system,'Segoe UI',sans-serif; }
    .title { font-size: 18px; font-weight: 700; fill: #111827; }
    .sub   { font-size: 12.5px; fill: #6b7280; }
    .h     { font-size: 12.5px; font-weight: 700; fill: #111827; }
    .d     { font-size: 11px; fill: #6b7280; }
    .num   { font-size: 11px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    .bnum  { font-size: 10px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    .side  { font-size: 11px; fill: #111827; }
    .item  { font-size: 10.5px; fill: #374151; }
    .grp   { font-size: 9px; font-weight: 700; fill: #9ca3af; }
    .pg    { font-size: 11.5px; fill: #9ca3af; }
  </style>

  <rect x="1" y="1" width="778" height="698" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="32" y="42" class="title">D1 · 시작 화면 — 데스크톱</text>
  <text x="32" y="64" class="sub">chatgpt.com · 컴퓨터 브라우저에서 봤을 때 · 파란 번호는 아래 설명과 짝</text>

  <!-- browser window -->
  <rect x="32" y="80" width="716" height="400" rx="10" fill="#ffffff" stroke="#374151" stroke-width="1.8"/>
  <circle cx="52" cy="95" r="5" fill="#e5e7eb" stroke="#d1d5db"/>
  <circle cx="68" cy="95" r="5" fill="#e5e7eb" stroke="#d1d5db"/>
  <circle cx="84" cy="95" r="5" fill="#e5e7eb" stroke="#d1d5db"/>
  <rect x="300" y="87" width="180" height="17" rx="8.5" fill="#f3f4f6"/>
  <text x="390" y="99" font-size="10" fill="#6b7280" text-anchor="middle">chatgpt.com</text>
  <line x1="33" y1="110" x2="747" y2="110" stroke="#e5e7eb"/>

  <!-- sidebar -->
  <path d="M 33,111 L 203,111 L 203,479 L 43,479 Q 33,479 33,469 Z" fill="#fafbfc"/>
  <line x1="203" y1="111" x2="203" y2="479" stroke="#e5e7eb"/>
  <text x="48" y="136" class="side" font-weight="700">◯ ChatGPT</text>
  <text x="48" y="164" class="side">✏️ 새 채팅</text>
  <text x="48" y="190" class="side">🔍 채팅 검색</text>
  <text x="48" y="216" class="side">🖼️ 라이브러리</text>
  <text x="48" y="242" class="side">🧩 GPTs</text>
  <text x="48" y="268" class="side">📁 프로젝트</text>
  <text x="48" y="298" class="grp">오늘</text>
  <text x="48" y="320" class="item">면접 준비 도와줘</text>
  <text x="48" y="342" class="item">회의록 3줄 요약</text>
  <text x="48" y="368" class="grp">어제</text>
  <text x="48" y="390" class="item">여행 일정 짜기</text>
  <line x1="41" y1="442" x2="195" y2="442" stroke="#e5e7eb"/>
  <circle cx="52" cy="460" r="9" fill="#e5e7eb" stroke="#d1d5db"/>
  <text x="66" y="464" font-size="11" fill="#111827">사용자 · Plus</text>

  <!-- main: model picker top-left -->
  <rect x="220" y="122" width="106" height="24" rx="12" fill="#ffffff" stroke="#d1d5db"/>
  <text x="273" y="138" font-size="10.5" fill="#374151" text-anchor="middle">ChatGPT 5 ⌄</text>

  <!-- greeting + composer -->
  <text x="475" y="240" font-size="15" font-weight="600" fill="#111827" text-anchor="middle">무엇을 도와드릴까요?</text>
  <rect x="330" y="268" width="290" height="84" rx="14" fill="#f3f4f6" stroke="#e5e7eb"/>
  <text x="346" y="294" class="pg">무엇이든 물어보세요</text>
  <circle cx="352" cy="328" r="10" fill="#ffffff" stroke="#9ca3af"/>
  <line x1="347" y1="328" x2="357" y2="328" stroke="#6b7280" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="352" y1="323" x2="352" y2="333" stroke="#6b7280" stroke-width="1.4" stroke-linecap="round"/>
  <text x="562" y="333" font-size="12">🎤</text>
  <circle cx="598" cy="328" r="11" fill="#111827"/>
  <rect x="592.5" y="324.5" width="2.6" height="7" rx="1.3" fill="#ffffff"/>
  <rect x="596.7" y="322.5" width="2.6" height="11" rx="1.3" fill="#ffffff"/>
  <rect x="600.9" y="324.5" width="2.6" height="7" rx="1.3" fill="#ffffff"/>

  <!-- suggestion chips -->
  <rect x="355" y="374" width="100" height="26" rx="13" fill="#ffffff" stroke="#d1d5db"/>
  <text x="405" y="391" font-size="10" fill="#374151" text-anchor="middle">💡 아이디어</text>
  <rect x="463" y="374" width="82" height="26" rx="13" fill="#ffffff" stroke="#d1d5db"/>
  <text x="504" y="391" font-size="10" fill="#374151" text-anchor="middle">📄 요약</text>

  <!-- badges -->
  <g>
    <circle cx="205" cy="134" r="8.5" fill="#2563eb"/><text x="205" y="138" class="bnum">1</text>
    <circle cx="332" cy="134" r="8.5" fill="#2563eb"/><text x="332" y="138" class="bnum">2</text>
    <circle cx="205" cy="242" r="8.5" fill="#2563eb"/><text x="205" y="246" class="bnum">3</text>
    <circle cx="330" cy="264" r="8.5" fill="#2563eb"/><text x="330" y="268" class="bnum">4</text>
    <circle cx="614" cy="318" r="8.5" fill="#2563eb"/><text x="614" y="322" class="bnum">5</text>
    <circle cx="556" cy="387" r="8.5" fill="#2563eb"/><text x="556" y="391" class="bnum">6</text>
  </g>

  <!-- legend -->
  <g>
    <circle cx="48" cy="512" r="10" fill="#2563eb"/><text x="48" y="516" class="num">1</text>
    <text x="66" y="516" class="h">사이드바 — 항상 펼쳐져 있음</text>
    <text x="66" y="534" class="d">모바일의 '서랍'이 상시 노출</text>

    <circle cx="48" cy="578" r="10" fill="#2563eb"/><text x="48" y="582" class="num">2</text>
    <text x="66" y="582" class="h">모델 선택 — 본문 왼쪽 위</text>
    <text x="66" y="600" class="d">Claude(입력바 안)와 위치가 다른 점</text>

    <circle cx="48" cy="644" r="10" fill="#2563eb"/><text x="48" y="648" class="num">3</text>
    <text x="66" y="648" class="h">부가 기능 묶음</text>
    <text x="66" y="666" class="d">라이브러리 · GPTs · 프로젝트 — 전부 사이드바에</text>

    <circle cx="400" cy="512" r="10" fill="#2563eb"/><text x="400" y="516" class="num">4</text>
    <text x="418" y="516" class="h">입력창 — 시작할 땐 화면 한가운데</text>
    <text x="418" y="534" class="d">첫 행동(질문)이 정중앙에 오게</text>

    <circle cx="400" cy="578" r="10" fill="#2563eb"/><text x="400" y="582" class="num">5</text>
    <text x="418" y="582" class="h">받아쓰기 · 음성 모드</text>
    <text x="418" y="600" class="d">입력창 오른쪽 끝</text>

    <circle cx="400" cy="644" r="10" fill="#2563eb"/><text x="400" y="648" class="num">6</text>
    <text x="418" y="648" class="h">제안 프롬프트</text>
    <text x="418" y="666" class="d">'뭘 물어봐야 하지?' — 빈 화면 문제 해결</text>
  </g>
</svg>
