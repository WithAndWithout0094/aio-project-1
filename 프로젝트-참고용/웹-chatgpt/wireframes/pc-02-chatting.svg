<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 700" role="img" aria-label="D2 대화 중 화면 와이어프레임 — 데스크톱 ChatGPT">
  <style>
    text { font-family: 'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',-apple-system,'Segoe UI',sans-serif; }
    .title { font-size: 18px; font-weight: 700; fill: #111827; }
    .sub   { font-size: 12.5px; fill: #6b7280; }
    .h     { font-size: 12.5px; font-weight: 700; fill: #111827; }
    .d     { font-size: 11px; fill: #6b7280; }
    .num   { font-size: 11px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    .bnum  { font-size: 10px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    .side  { font-size: 11px; fill: #111827; }
    .item  { font-size: 10.5px; fill: #374151; }
    .grp   { font-size: 9px; font-weight: 700; fill: #9ca3af; }
    .pg    { font-size: 10.5px; fill: #9ca3af; }
  </style>

  <rect x="1" y="1" width="778" height="698" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="32" y="42" class="title">D2 · 대화 중 — 데스크톱</text>
  <text x="32" y="64" class="sub">모델 선택은 대화 중에도 왼쪽 위 · 글은 가운데 좁은 칼럼에만</text>

  <!-- browser window -->
  <rect x="32" y="80" width="716" height="400" rx="10" fill="#ffffff" stroke="#374151" stroke-width="1.8"/>
  <circle cx="52" cy="95" r="5" fill="#e5e7eb" stroke="#d1d5db"/>
  <circle cx="68" cy="95" r="5" fill="#e5e7eb" stroke="#d1d5db"/>
  <circle cx="84" cy="95" r="5" fill="#e5e7eb" stroke="#d1d5db"/>
  <rect x="300" y="87" width="180" height="17" rx="8.5" fill="#f3f4f6"/>
  <text x="390" y="99" font-size="10" fill="#6b7280" text-anchor="middle">chatgpt.com</text>
  <line x1="33" y1="110" x2="747" y2="110" stroke="#e5e7eb"/>

  <!-- sidebar -->
  <path d="M 33,111 L 203,111 L 203,479 L 43,479 Q 33,479 33,469 Z" fill="#fafbfc"/>
  <line x1="203" y1="111" x2="203" y2="479" stroke="#e5e7eb"/>
  <text x="48" y="136" class="side" font-weight="700">◯ ChatGPT</text>
  <text x="48" y="164" class="side">✏️ 새 채팅</text>
  <text x="48" y="190" class="side">🔍 채팅 검색</text>
  <text x="48" y="216" class="side">🖼️ 라이브러리</text>
  <text x="48" y="242" class="side">🧩 GPTs</text>
  <text x="48" y="268" class="side">📁 프로젝트</text>
  <text x="48" y="298" class="grp">오늘</text>
  <rect x="41" y="306" width="154" height="20" rx="6" fill="#eef2ff"/>
  <text x="48" y="320" font-size="10.5" fill="#1e3a8a">면접 준비 도와줘</text>
  <text x="48" y="342" class="item">회의록 3줄 요약</text>
  <text x="48" y="368" class="grp">어제</text>
  <text x="48" y="390" class="item">여행 일정 짜기</text>
  <line x1="41" y1="442" x2="195" y2="442" stroke="#e5e7eb"/>
  <circle cx="52" cy="460" r="9" fill="#e5e7eb" stroke="#d1d5db"/>
  <text x="66" y="464" font-size="11" fill="#111827">사용자 · Plus</text>

  <!-- model picker stays top-left -->
  <rect x="220" y="122" width="106" height="24" rx="12" fill="#ffffff" stroke="#d1d5db"/>
  <text x="273" y="138" font-size="10.5" fill="#374151" text-anchor="middle">ChatGPT 5 ⌄</text>

  <!-- reading column -->
  <rect x="470" y="168" width="180" height="40" rx="12" fill="#e9ecef"/>
  <text x="484" y="185" font-size="10.5" fill="#111827">다음 주에 면접이 있어.</text>
  <text x="484" y="199" font-size="10.5" fill="#111827">뭐부터 준비할까?</text>

  <circle cx="310" cy="238" r="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <path transform="translate(310,238)" d="M0,-3.5 C0.5,-0.9 0.9,-0.5 3.5,0 C0.9,0.5 0.5,0.9 0,3.5 C-0.5,0.9 -0.9,0.5 -3.5,0 C-0.9,-0.5 -0.5,-0.9 0,-3.5 Z" fill="#9ca3af"/>
  <text x="300" y="264" font-size="11" fill="#111827">좋아요. 이렇게 시작해 봅시다.</text>
  <rect x="300" y="278" width="350" height="7" rx="3.5" fill="#e5e7eb"/>
  <rect x="300" y="292" width="330" height="7" rx="3.5" fill="#e5e7eb"/>
  <rect x="300" y="306" width="348" height="7" rx="3.5" fill="#e5e7eb"/>
  <rect x="300" y="320" width="210" height="7" rx="3.5" fill="#e5e7eb"/>
  <rect x="514" y="315" width="3" height="12" fill="#2563eb"/>
  <text x="300" y="350" font-size="10.5" fill="#6b7280">복사 · 👍 · 👎 · 공유 · 재생성</text>

  <!-- docked composer -->
  <rect x="300" y="420" width="350" height="44" rx="12" fill="#f3f4f6" stroke="#e5e7eb"/>
  <text x="316" y="446" class="pg">무엇이든 물어보세요</text>
  <circle cx="630" cy="442" r="9" fill="#111827"/>
  <line x1="630" y1="446" x2="630" y2="439" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M 627,441.5 L 630,438.5 L 633,441.5" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- badges -->
  <g>
    <circle cx="332" cy="134" r="8.5" fill="#2563eb"/><text x="332" y="138" class="bnum">1</text>
    <circle cx="462" cy="164" r="8.5" fill="#2563eb"/><text x="462" y="168" class="bnum">2</text>
    <circle cx="662" cy="238" r="8.5" fill="#2563eb"/><text x="662" y="242" class="bnum">3</text>
    <circle cx="466" cy="347" r="8.5" fill="#2563eb"/><text x="466" y="351" class="bnum">4</text>
    <circle cx="296" cy="416" r="8.5" fill="#2563eb"/><text x="296" y="420" class="bnum">5</text>
  </g>

  <!-- legend -->
  <g>
    <circle cx="48" cy="512" r="10" fill="#2563eb"/><text x="48" y="516" class="num">1</text>
    <text x="66" y="516" class="h">모델 선택 — 대화 중에도 왼쪽 위</text>
    <text x="66" y="534" class="d">언제든 모델을 바꿔 이어서 대화</text>

    <circle cx="48" cy="578" r="10" fill="#2563eb"/><text x="48" y="582" class="num">2</text>
    <text x="66" y="582" class="h">내 질문 — 오른쪽 · 회색 · 좁게</text>
    <text x="66" y="600" class="d">모바일과 똑같은 규칙</text>

    <circle cx="48" cy="644" r="10" fill="#2563eb"/><text x="48" y="648" class="num">3</text>
    <text x="66" y="648" class="h">답변 — 왼쪽 · 칼럼 전체 폭</text>
    <text x="66" y="666" class="d">스트리밍 커서도 그대로</text>

    <circle cx="400" cy="512" r="10" fill="#2563eb"/><text x="400" y="516" class="num">4</text>
    <text x="418" y="516" class="h">답변 액션</text>
    <text x="418" y="534" class="d">복사 · 평가 · 공유 · 재생성</text>

    <circle cx="400" cy="578" r="10" fill="#2563eb"/><text x="400" y="582" class="num">5</text>
    <text x="418" y="582" class="h">입력창 — 대화 중엔 하단 고정</text>
    <text x="418" y="600" class="d">읽기 폭도 가운데 칼럼으로 제한</text>
  </g>
</svg>
