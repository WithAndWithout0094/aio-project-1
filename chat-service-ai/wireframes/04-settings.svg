<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 840" role="img" aria-label="W4 설정 화면 와이어프레임 — Claude">
  <style>
    text { font-family: 'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',-apple-system,'Segoe UI',sans-serif; }
    .title { font-size: 18px; font-weight: 700; fill: #111827; }
    .sub   { font-size: 12.5px; fill: #6b7280; }
    .h     { font-size: 13px; font-weight: 700; fill: #111827; }
    .d     { font-size: 11.5px; fill: #6b7280; }
    .num   { font-size: 11px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    .bnum  { font-size: 10.5px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    .lab   { font-size: 12.5px; fill: #111827; }
    .val   { font-size: 11.5px; fill: #9ca3af; text-anchor: end; }
    .chev  { font-size: 13px; fill: #c0c4cc; }
    .grp   { font-size: 10.5px; font-weight: 700; fill: #9ca3af; }
  </style>

  <!-- card background -->
  <rect x="1" y="1" width="778" height="838" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="32" y="42" class="title">W4 · 설정 화면</text>
  <text x="32" y="64" class="sub">사이드바 하단의 프로필에서 진입</text>

  <!-- phone frame -->
  <rect x="36" y="92" width="336" height="708" rx="26" fill="#ffffff" stroke="#374151" stroke-width="2"/>

  <!-- status bar -->
  <text x="64" y="122" font-size="10.5" fill="#9ca3af">9:41</text>
  <rect x="326" y="112" width="22" height="11" rx="3" fill="none" stroke="#9ca3af"/>
  <rect x="328" y="114" width="13" height="7" rx="1.5" fill="#9ca3af"/>
  <rect x="349" y="115" width="3" height="5" rx="1" fill="#9ca3af"/>

  <!-- header -->
  <g stroke="#374151" stroke-width="2" stroke-linecap="round" fill="none">
    <line x1="74" y1="148" x2="64" y2="157"/>
    <line x1="64" y1="157" x2="74" y2="166"/>
  </g>
  <text x="204" y="162" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">설정</text>
  <line x1="38" y1="182" x2="370" y2="182" stroke="#e5e7eb"/>

  <!-- section: account -->
  <text x="56" y="210" class="grp">계정</text>
  <rect x="52" y="220" width="304" height="80" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="66" y="246" class="lab">이메일</text>
  <text x="344" y="246" class="val">user@example.com</text>
  <line x1="52" y1="260" x2="356" y2="260" stroke="#f1f3f5"/>
  <text x="66" y="286" class="lab">구독 관리</text>
  <text x="334" y="286" class="val">Pro · 관리</text>
  <text x="344" y="287" class="chev">›</text>

  <!-- section: personalization -->
  <text x="56" y="330" class="grp">개인 맞춤</text>
  <rect x="52" y="340" width="304" height="80" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="66" y="366" class="lab">응답 스타일</text>
  <text x="334" y="366" class="val">기본</text>
  <text x="344" y="367" class="chev">›</text>
  <line x1="52" y1="380" x2="356" y2="380" stroke="#f1f3f5"/>
  <text x="66" y="406" class="lab">메모리</text>
  <text x="334" y="406" class="val">켜짐</text>
  <text x="344" y="407" class="chev">›</text>

  <!-- section: app -->
  <text x="56" y="450" class="grp">앱</text>
  <rect x="52" y="460" width="304" height="160" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="66" y="486" class="lab">음성</text>
  <text x="344" y="487" class="chev">›</text>
  <line x1="52" y1="500" x2="356" y2="500" stroke="#f1f3f5"/>
  <text x="66" y="526" class="lab">알림</text>
  <text x="334" y="526" class="val">켜짐</text>
  <text x="344" y="527" class="chev">›</text>
  <line x1="52" y1="540" x2="356" y2="540" stroke="#f1f3f5"/>
  <text x="66" y="566" class="lab">화면 모드</text>
  <text x="334" y="566" class="val">시스템</text>
  <text x="344" y="567" class="chev">›</text>
  <line x1="52" y1="580" x2="356" y2="580" stroke="#f1f3f5"/>
  <text x="66" y="606" class="lab">언어</text>
  <text x="334" y="606" class="val">한국어</text>
  <text x="344" y="607" class="chev">›</text>

  <!-- section: info -->
  <text x="56" y="650" class="grp">정보</text>
  <rect x="52" y="660" width="304" height="120" rx="10" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="66" y="686" class="lab">도움말</text>
  <text x="344" y="687" class="chev">›</text>
  <line x1="52" y1="700" x2="356" y2="700" stroke="#f1f3f5"/>
  <text x="66" y="726" class="lab">이용약관</text>
  <text x="344" y="727" class="chev">›</text>
  <line x1="52" y1="740" x2="356" y2="740" stroke="#f1f3f5"/>
  <text x="66" y="766" class="lab">버전</text>
  <text x="344" y="766" class="val">1.2026.220</text>

  <!-- in-phone badges (left rail) -->
  <g>
    <circle cx="46" cy="238" r="9" fill="#2563eb"/><text x="46" y="242" class="bnum">1</text>
    <circle cx="46" cy="378" r="9" fill="#2563eb"/><text x="46" y="382" class="bnum">2</text>
    <circle cx="46" cy="538" r="9" fill="#2563eb"/><text x="46" y="542" class="bnum">3</text>
  </g>

  <!-- legend -->
  <g>
    <circle cx="430" cy="180" r="10" fill="#2563eb"/><text x="430" y="184" class="num">1</text>
    <text x="450" y="184" class="h">계정 · 구독</text>
    <text x="450" y="204" class="d">로그인 정보와 결제가 사는 곳</text>
    <text x="450" y="220" class="d">Free → Pro/Max 전환이 일어나는 화면</text>

    <circle cx="430" cy="310" r="10" fill="#2563eb"/><text x="430" y="314" class="num">2</text>
    <text x="450" y="314" class="h">개인 맞춤</text>
    <text x="450" y="334" class="d">말투(응답 스타일)와 기억(메모리)을</text>
    <text x="450" y="350" class="d">사용자가 직접 켜고 끄는 곳</text>

    <circle cx="430" cy="440" r="10" fill="#2563eb"/><text x="430" y="444" class="num">3</text>
    <text x="450" y="444" class="h">앱 환경</text>
    <text x="450" y="464" class="d">음성 · 알림 · 화면 모드 · 언어</text>
  </g>

  <!-- pattern note -->
  <rect x="418" y="540" width="330" height="70" rx="10" fill="#f8fafc" stroke="#e5e7eb"/>
  <text x="434" y="568" class="d" fill="#475569">패턴 노트 — 모든 항목이 '목록 + ›' 한 가지 패턴.</text>
  <text x="434" y="588" class="d" fill="#475569">새로 배울 것이 없어야 좋은 설정 화면.</text>
</svg>
