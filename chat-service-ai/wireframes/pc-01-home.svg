<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 700" role="img" aria-label="D1 시작 화면 와이어프레임 — 데스크톱 Claude">
  <style>
    text { font-family: 'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',-apple-system,'Segoe UI',sans-serif; }
    .title { font-size: 18px; font-weight: 700; fill: #111827; }
    .sub   { font-size: 12.5px; fill: #6b7280; }
    .h     { font-size: 12.5px; font-weight: 700; fill: #111827; }
    .d     { font-size: 11px; fill: #6b7280; }
    .num   { font-size: 11px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    .bnum  { font-size: 10px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    .side  { font-size: 11.5px; fill: #111827; }
    .item  { font-size: 11px; fill: #374151; }
    .grp   { font-size: 9.5px; font-weight: 700; fill: #9ca3af; }
    .pg    { font-size: 11.5px; fill: #9ca3af; }
  </style>

  <!-- card background -->
  <rect x="1" y="1" width="778" height="698" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="32" y="42" class="title">D1 · 시작 화면 — 데스크톱</text>
  <text x="32" y="64" class="sub">claude.ai · 컴퓨터 브라우저에서 봤을 때 · 파란 번호는 아래 설명과 짝</text>

  <!-- browser window -->
  <rect x="32" y="80" width="716" height="400" rx="10" fill="#ffffff" stroke="#374151" stroke-width="1.8"/>
  <circle cx="52" cy="95" r="5" fill="#e5e7eb" stroke="#d1d5db"/>
  <circle cx="68" cy="95" r="5" fill="#e5e7eb" stroke="#d1d5db"/>
  <circle cx="84" cy="95" r="5" fill="#e5e7eb" stroke="#d1d5db"/>
  <rect x="300" y="87" width="180" height="17" rx="8.5" fill="#f3f4f6"/>
  <text x="390" y="99" font-size="10" fill="#6b7280" text-anchor="middle">claude.ai</text>
  <line x1="33" y1="110" x2="747" y2="110" stroke="#e5e7eb"/>

  <!-- sidebar (always visible) -->
  <path d="M 33,111 L 203,111 L 203,479 L 43,479 Q 33,479 33,469 Z" fill="#fafbfc"/>
  <line x1="203" y1="111" x2="203" y2="479" stroke="#e5e7eb"/>
  <text x="48" y="138" class="side" font-weight="700">✱ Claude</text>
  <text x="48" y="168" class="side">✏️ 새 채팅</text>
  <text x="48" y="194" class="side">💬 채팅</text>
  <text x="48" y="220" class="side">📁 프로젝트</text>
  <text x="48" y="250" class="grp">최근 항목</text>
  <text x="48" y="272" class="item">면접 준비 도와줘</text>
  <text x="48" y="294" class="item">회의록 3줄 요약</text>
  <text x="48" y="316" class="item">서울 날씨와 우산</text>
  <text x="48" y="338" class="item">여행 일정 짜기</text>
  <line x1="41" y1="442" x2="195" y2="442" stroke="#e5e7eb"/>
  <circle cx="52" cy="460" r="9" fill="#e5e7eb" stroke="#d1d5db"/>
  <text x="66" y="464" font-size="11" fill="#111827">사용자 · Pro</text>

  <!-- main: greeting + centered composer -->
  <circle cx="475" cy="205" r="18" fill="#f3f4f6" stroke="#d1d5db"/>
  <path transform="translate(475,205)" d="M0,-6.5 C0.9,-1.7 1.7,-0.9 6.5,0 C1.7,0.9 0.9,1.7 0,6.5 C-0.9,1.7 -1.7,0.9 -6.5,0 C-1.7,-0.9 -0.9,-1.7 0,-6.5 Z" fill="#9ca3af"/>
  <text x="475" y="250" font-size="15" font-weight="600" fill="#111827" text-anchor="middle">좋은 아침이에요, 사용자님</text>

  <rect x="330" y="280" width="290" height="84" rx="14" fill="#f3f4f6" stroke="#e5e7eb"/>
  <text x="346" y="306" class="pg">오늘 무엇을 도와드릴까요?</text>
  <circle cx="352" cy="340" r="10" fill="#ffffff" stroke="#9ca3af"/>
  <line x1="347" y1="340" x2="357" y2="340" stroke="#6b7280" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="352" y1="335" x2="352" y2="345" stroke="#6b7280" stroke-width="1.4" stroke-linecap="round"/>
  <rect x="372" y="329" width="78" height="22" rx="11" fill="#ffffff" stroke="#d1d5db"/>
  <text x="411" y="344" font-size="9.5" fill="#374151" text-anchor="middle">Sonnet 5 ⌄</text>
  <circle cx="598" cy="340" r="11" fill="#111827"/>
  <line x1="598" y1="345" x2="598" y2="336" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M 594,339 L 598,335 L 602,339" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- badges -->
  <g>
    <circle cx="205" cy="136" r="8.5" fill="#2563eb"/><text x="205" y="140" class="bnum">1</text>
    <circle cx="205" cy="164" r="8.5" fill="#2563eb"/><text x="205" y="168" class="bnum">2</text>
    <circle cx="205" cy="268" r="8.5" fill="#2563eb"/><text x="205" y="272" class="bnum">3</text>
    <circle cx="330" cy="276" r="8.5" fill="#2563eb"/><text x="330" y="280" class="bnum">4</text>
    <circle cx="460" cy="340" r="8.5" fill="#2563eb"/><text x="460" y="344" class="bnum">5</text>
  </g>

  <!-- legend (2 columns) -->
  <g>
    <circle cx="48" cy="512" r="10" fill="#2563eb"/><text x="48" y="516" class="num">1</text>
    <text x="66" y="516" class="h">사이드바 — 항상 펼쳐져 있음</text>
    <text x="66" y="534" class="d">모바일의 '서랍'이 상시 노출 — 뼈대는 같음</text>

    <circle cx="48" cy="578" r="10" fill="#2563eb"/><text x="48" y="582" class="num">2</text>
    <text x="66" y="582" class="h">새 채팅</text>
    <text x="66" y="600" class="d">사이드바 맨 위 — 가장 자주 쓰는 버튼</text>

    <circle cx="48" cy="644" r="10" fill="#2563eb"/><text x="48" y="648" class="num">3</text>
    <text x="66" y="648" class="h">최근 항목</text>
    <text x="66" y="666" class="d">최근 대화가 최신순으로</text>

    <circle cx="400" cy="512" r="10" fill="#2563eb"/><text x="400" y="516" class="num">4</text>
    <text x="418" y="516" class="h">입력창 — 시작할 땐 화면 한가운데</text>
    <text x="418" y="534" class="d">첫 행동(질문)이 정중앙에 오게</text>

    <circle cx="400" cy="578" r="10" fill="#2563eb"/><text x="400" y="582" class="num">5</text>
    <text x="418" y="582" class="h">모델 선택</text>
    <text x="418" y="600" class="d">입력창 안 — 모바일과 같은 위치</text>
  </g>
</svg>
