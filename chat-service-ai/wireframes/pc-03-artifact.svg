<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 640" role="img" aria-label="D3 아티팩트 분할 화면 와이어프레임 — 데스크톱 Claude">
  <style>
    text { font-family: 'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',-apple-system,'Segoe UI',sans-serif; }
    .title { font-size: 18px; font-weight: 700; fill: #111827; }
    .sub   { font-size: 12.5px; fill: #6b7280; }
    .h     { font-size: 12.5px; font-weight: 700; fill: #111827; }
    .d     { font-size: 11px; fill: #6b7280; }
    .num   { font-size: 11px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    .bnum  { font-size: 10px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    .pg    { font-size: 9.5px; fill: #9ca3af; }
  </style>

  <!-- card background -->
  <rect x="1" y="1" width="778" height="638" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="32" y="42" class="title">D3 · 아티팩트 분할 화면 — 데스크톱</text>
  <text x="32" y="64" class="sub">긴 결과물(문서·코드·화면)이 옆 패널로 열리는, 데스크톱만의 화면</text>

  <!-- browser window -->
  <rect x="32" y="80" width="716" height="400" rx="10" fill="#ffffff" stroke="#374151" stroke-width="1.8"/>
  <circle cx="52" cy="95" r="5" fill="#e5e7eb" stroke="#d1d5db"/>
  <circle cx="68" cy="95" r="5" fill="#e5e7eb" stroke="#d1d5db"/>
  <circle cx="84" cy="95" r="5" fill="#e5e7eb" stroke="#d1d5db"/>
  <rect x="300" y="87" width="180" height="17" rx="8.5" fill="#f3f4f6"/>
  <text x="390" y="99" font-size="10" fill="#6b7280" text-anchor="middle">claude.ai</text>
  <line x1="33" y1="110" x2="747" y2="110" stroke="#e5e7eb"/>

  <!-- collapsed icon rail -->
  <path d="M 33,111 L 81,111 L 81,479 L 43,479 Q 33,479 33,469 Z" fill="#fafbfc"/>
  <line x1="81" y1="111" x2="81" y2="479" stroke="#e5e7eb"/>
  <text x="57" y="140" font-size="12" text-anchor="middle">✱</text>
  <text x="57" y="172" font-size="12" text-anchor="middle">✏️</text>
  <text x="57" y="202" font-size="12" text-anchor="middle">💬</text>
  <text x="57" y="232" font-size="12" text-anchor="middle">📁</text>

  <!-- left: conversation pane -->
  <text x="236" y="134" font-size="11" font-weight="600" fill="#111827" text-anchor="middle">면접 준비 도와줘</text>
  <line x1="92" y1="146" x2="380" y2="146" stroke="#f0f2f5"/>
  <rect x="245" y="162" width="130" height="38" rx="10" fill="#e9ecef"/>
  <text x="256" y="178" font-size="9.5" fill="#111827">면접 답변을 문서로</text>
  <text x="256" y="192" font-size="9.5" fill="#111827">정리해 줘</text>
  <circle cx="100" cy="226" r="7" fill="#f3f4f6" stroke="#d1d5db"/>
  <path transform="translate(100,226)" d="M0,-3 C0.4,-0.8 0.8,-0.4 3,0 C0.8,0.4 0.4,0.8 0,3 C-0.4,0.8 -0.8,0.4 -3,0 C-0.8,-0.4 -0.4,-0.8 0,-3 Z" fill="#9ca3af"/>
  <text x="92" y="252" font-size="10" fill="#111827">정리해서 옆에 문서로 만들었어요.</text>
  <rect x="92" y="266" width="270" height="6" rx="3" fill="#e5e7eb"/>
  <rect x="92" y="278" width="250" height="6" rx="3" fill="#e5e7eb"/>
  <rect x="92" y="290" width="264" height="6" rx="3" fill="#e5e7eb"/>
  <rect x="92" y="430" width="280" height="36" rx="10" fill="#f3f4f6" stroke="#e5e7eb"/>
  <text x="106" y="452" class="pg">이어서 물어보세요</text>

  <!-- divider -->
  <line x1="390" y1="111" x2="390" y2="479" stroke="#e5e7eb"/>

  <!-- right: artifact panel -->
  <rect x="391" y="111" width="356" height="30" fill="#fafbfc"/>
  <line x1="391" y1="141" x2="747" y2="141" stroke="#e5e7eb"/>
  <text x="406" y="130" font-size="10.5" font-weight="600" fill="#111827">면접 답변 정리.md</text>
  <rect x="592" y="118" width="52" height="17" rx="8.5" fill="#eef2ff" stroke="#d7e3fb"/>
  <text x="618" y="130" font-size="9" fill="#1e3a8a" text-anchor="middle">미리보기</text>
  <rect x="648" y="118" width="34" height="17" rx="8.5" fill="#ffffff" stroke="#d1d5db"/>
  <text x="665" y="130" font-size="9" fill="#6b7280" text-anchor="middle">코드</text>
  <text x="706" y="131" font-size="10" fill="#6b7280">복사</text>

  <!-- artifact document skeleton -->
  <rect x="410" y="162" width="180" height="10" rx="4" fill="#dfe3e8"/>
  <rect x="410" y="188" width="300" height="7" rx="3.5" fill="#e9edf1"/>
  <rect x="410" y="204" width="280" height="7" rx="3.5" fill="#e9edf1"/>
  <rect x="410" y="220" width="296" height="7" rx="3.5" fill="#e9edf1"/>
  <rect x="410" y="236" width="220" height="7" rx="3.5" fill="#e9edf1"/>
  <rect x="410" y="262" width="140" height="8" rx="4" fill="#dfe3e8"/>
  <rect x="410" y="284" width="300" height="7" rx="3.5" fill="#e9edf1"/>
  <rect x="410" y="300" width="264" height="7" rx="3.5" fill="#e9edf1"/>
  <rect x="410" y="316" width="290" height="7" rx="3.5" fill="#e9edf1"/>
  <rect x="410" y="332" width="180" height="7" rx="3.5" fill="#e9edf1"/>

  <!-- badges -->
  <g>
    <circle cx="81" cy="136" r="8.5" fill="#2563eb"/><text x="81" y="140" class="bnum">1</text>
    <circle cx="96" cy="162" r="8.5" fill="#2563eb"/><text x="96" y="166" class="bnum">2</text>
    <circle cx="396" cy="158" r="8.5" fill="#2563eb"/><text x="396" y="162" class="bnum">3</text>
    <circle cx="694" cy="118" r="8.5" fill="#2563eb"/><text x="694" y="122" class="bnum">4</text>
  </g>

  <!-- legend (2 columns) -->
  <g>
    <circle cx="48" cy="512" r="10" fill="#2563eb"/><text x="48" y="516" class="num">1</text>
    <text x="66" y="516" class="h">사이드바는 아이콘만</text>
    <text x="66" y="534" class="d">자리를 아껴 작업 공간을 넓게</text>

    <circle cx="48" cy="578" r="10" fill="#2563eb"/><text x="48" y="582" class="num">2</text>
    <text x="66" y="582" class="h">대화는 왼쪽 절반</text>
    <text x="66" y="600" class="d">지시를 내리고 고쳐 달라고 말하는 곳</text>

    <circle cx="400" cy="512" r="10" fill="#2563eb"/><text x="400" y="516" class="num">3</text>
    <text x="418" y="516" class="h">아티팩트 패널</text>
    <text x="418" y="534" class="d">긴 결과물이 채팅에 묻히지 않게 옆으로 분리</text>

    <circle cx="400" cy="578" r="10" fill="#2563eb"/><text x="400" y="582" class="num">4</text>
    <text x="418" y="582" class="h">미리보기 ↔ 코드 · 복사</text>
    <text x="418" y="600" class="d">결과물을 바로 보고, 바꾸고, 가져가는 도구</text>
  </g>
</svg>
